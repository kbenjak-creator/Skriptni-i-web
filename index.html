<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    svg{
        border: 1px solid black
    }
</head>
<body>
    <svg width="700" height="700">

        <rect
            x="50"
            y="50"
            width="200"
            height="200"
            fill="pink"
            stroke="black"
            stroke-width="3"

            />
        <circle
            cx="350"
            cy="400"
            r="50"
            fill="yellow"
            />
            <ellipse
                cx="150"
                cy="250"
                rx="100"
                ry="50"
                fill="green"
            />
            <line
            x1="500"
            y1="500"
            x2="600"
            y2="600"
            stroke="blue"
            stroke-width="5"
            />

            

        
    </svg>


</body>
</html>
